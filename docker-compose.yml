services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ESTIMATOR_FRONTEND_ORIGIN: http://localhost:5173

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
