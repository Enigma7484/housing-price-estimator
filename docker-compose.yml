services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resaleiq
      POSTGRES_USER: resaleiq
      POSTGRES_PASSWORD: resaleiq_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resaleiq -d resaleiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ESTIMATOR_FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://resaleiq:resaleiq_dev@postgres:5432/resaleiq
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
